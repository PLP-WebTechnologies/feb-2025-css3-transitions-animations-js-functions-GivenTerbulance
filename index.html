<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Animated Button with localStorage</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <h1>Animated Button Example</h1>

  <button id="animateBtn">Click Me!</button>

  <label for="speedSelect">Animation Speed:</label>
  <select id="speedSelect">
    <option value="1s">Normal</option>
    <option value="2s">Slow</option>
    <option value="0.5s">Fast</option>
  </select>

  <script src="script.js"></script>
</body>
</html>
